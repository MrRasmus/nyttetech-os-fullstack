services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
        NEXT_PUBLIC_WS_BASE: ""
        NEXT_PUBLIC_GAME_URL: /game/
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  game:
    build: ./games/factory-meltdown
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: nyttetech
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default
      - web
    depends_on:
      - frontend
      - backend
      - game

networks:
  web:
    external: true